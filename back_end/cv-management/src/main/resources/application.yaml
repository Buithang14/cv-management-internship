spring:
  application:
    name: cv-management
  
  datasource:
    url: jdbc:mariadb://localhost:3307/cv_management
    username: root
    password: root
    driver-class-name: org.mariadb.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MariaDBDialect
