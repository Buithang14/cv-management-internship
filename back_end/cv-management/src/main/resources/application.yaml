spring:
  application:
    name: cv-management
  
  config:
     import: optional:file:.env[.properties], optional:file:../.env[.properties], optional:file:../../.env[.properties]
     # Đọc file .env ở thư mục hiện tại hoặc thư mục cha nếu chạy từ root IDE

  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.mariadb.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MariaDBDialect

# JWT Configuration (đọc bảo mật từ .env)
jwt:
  secret: ${JWT_SECRET}
  expiration-ms: ${JWT_EXPIRATION_MS:86400000}  # mặc định 24 giờ nếu không set


